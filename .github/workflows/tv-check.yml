name: TV emulator check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/tv_check.sh
      - name: Build Mi Remote debug
        run: ./gradlew --no-daemon :remote:assembleDebug
      - name: Run Mi Remote on a phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/phone_check.sh
      - name: Publish results to ci-tv branch
        if: always()
        run: |
          mkdir -p ci-out && cd ci-out
          git init -q -b ci-tv
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "tv check ${GITHUB_SHA::7}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-tv
