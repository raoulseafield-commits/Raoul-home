name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Bake in starter art (public domain, Art Institute of Chicago)
        run: python3 tools/fetch_art.py app/src/main/assets/art || echo "Art download failed, building without starter art"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk home.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-apk
          path: home.apk

      - name: Publish to the "latest" release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest home.apk \
            --title "Dipixel Home (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download home.apk and install on the Xiaomi Box."
