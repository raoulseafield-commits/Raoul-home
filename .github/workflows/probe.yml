name: Probe (photos + streaming data)

on:
  workflow_dispatch:
    inputs:
      script:
        description: probe script
        default: tools/probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 ${{ github.event.inputs.script || 'tools/probe.py' }}
      - name: Publish results to ci-results branch
        run: |
          cd ci-out
          git init -q -b ci-results
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "probe results ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
